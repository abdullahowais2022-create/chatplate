<html><head><meta charset="utf-8">
<style>

:root{--ink:#141210;--paper:#F6F2EA;--o:#EE621A;--o2:#E35413;--muted:#8a8178;--line:#e6dfd3}
*{box-sizing:border-box}
html,body{margin:0;background:#000}
#stage{position:relative;overflow:hidden;font-family:IS,NA,ND,'WenQuanYi Zen Hei','Noto Color Emoji',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;overflow:hidden;display:none}
.a{position:absolute;left:0;top:0;will-change:transform}
.mono{font-family:JB,monospace}
.serif{font-family:ISerif,serif;font-style:italic;font-weight:400;letter-spacing:-.01em}
.h{font-weight:700;letter-spacing:-.045em;line-height:1.02}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .04em .14em;margin-bottom:-.14em}
.mask>span{display:inline-block}
.kick{font-family:JB,monospace;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;z-index:90}
/* phone */
.phone{width:460px;height:940px;border-radius:66px;background:#0e0d0c;padding:13px;box-shadow:0 50px 110px rgba(20,10,0,.28),0 0 0 2px #2a2826 inset}
.scr{width:100%;height:100%;border-radius:54px;overflow:hidden;position:relative}
.notch{position:absolute;left:50%;top:14px;width:120px;height:32px;border-radius:20px;background:#0e0d0c;transform:translateX(-50%);z-index:5}
/* lock screen */
.lock{background:#2a2420;color:#fff}
.notif{position:absolute;left:14px;right:14px;height:92px;border-radius:24px;background:rgba(250,247,242,.94);color:#1b1815;padding:14px 16px;display:flex;gap:12px}
.notif .ic{width:38px;height:38px;border-radius:10px;background:#1FA855;flex:none;display:flex;align-items:center;justify-content:center}
.notif .t1{font-size:14px;color:#6f675f;display:flex;justify-content:space-between;width:100%}
.notif .t2{font-size:17px;font-weight:650;margin-top:2px}
.notif .t3{font-size:16px;color:#3b3631;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
/* chats list */
.list{background:#fff}
.lhead{height:120px;padding:58px 22px 0;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:30px;letter-spacing:-.02em}
.row{position:absolute;left:0;right:0;height:92px;display:flex;align-items:center;gap:14px;padding:0 20px;background:#fff}
.row .av{width:56px;height:56px;border-radius:50%;flex:none;color:#fff;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center}
.row .mid{flex:1;min-width:0;border-bottom:1px solid #eee8de;height:92px;display:flex;flex-direction:column;justify-content:center}
.row .n{font-weight:650;font-size:19px;display:flex;justify-content:space-between}
.row .n span{font-weight:500;font-size:14px;color:#1FA855}
.row .p{font-size:16.5px;color:#5c554e;display:flex;justify-content:space-between;align-items:center;margin-top:3px;white-space:nowrap}
.row .b{min-width:24px;height:24px;border-radius:12px;background:#1FA855;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 7px}
/* chat */
.chat{background:#EFE9DF}
.chead{height:118px;background:#fff;display:flex;align-items:flex-end;gap:14px;padding:0 20px 16px;border-bottom:1px solid #e6dfd3}
.chead .av{width:52px;height:52px;border-radius:50%;background:var(--o);color:#fff;font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center}
.msgs{position:absolute;left:0;right:0;top:132px;padding:0 14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:350px;padding:10px 14px 7px;border-radius:16px;font-size:19.5px;line-height:1.3;box-shadow:0 1px 1px rgba(0,0,0,.07)}
.m.in{background:#fff;align-self:flex-start;border-top-left-radius:4px;transform-origin:0 0}
.m.out{background:#D9FDD3;align-self:flex-end;border-top-right-radius:4px;transform-origin:100% 0}
.m .tm{font-size:12px;color:#8d8a85;text-align:right;margin-top:1px}
.typing{display:flex;gap:6px;padding:14px 16px}
.typing i{width:10px;height:10px;border-radius:50%;background:#9c958d;display:block}
.ord{margin-top:8px;border-top:1px dashed #d8d0c4;padding-top:8px;font-size:18.5px}
.ol{display:flex;justify-content:space-between;gap:16px;margin:3px 0}
.ol .pr{font-family:JB,monospace;font-weight:600;min-width:70px;text-align:right}
.tot{font-weight:700;border-top:1px solid #e4ddd2;margin-top:6px;padding-top:6px}
.paybtn{margin-top:10px;position:relative;display:inline-block;background:#f0ede8;border-radius:10px;padding:8px 14px;font-weight:650;font-size:17px;color:#5c554e}
/* menu card */
.menu{width:400px;background:#fffdf8;border-radius:20px;padding:26px 28px;box-shadow:0 30px 70px rgba(40,20,5,.18),0 0 0 1px #ece4d6}
.menu .mt{font-family:ISerif,serif;font-style:italic;font-size:38px;letter-spacing:-.01em}
.menu .ms{font-family:JB,monospace;font-size:13px;letter-spacing:.18em;color:var(--muted);margin:4px 0 16px}
.mr{display:flex;justify-content:space-between;font-size:20px;padding:9px 0;border-bottom:1px dotted #ddd3c3;position:relative}
.mr .mp{font-family:JB,monospace;font-weight:600}
.hl{position:absolute;left:-8px;right:-8px;top:4px;bottom:4px;background:rgba(238,98,26,.14);border-radius:8px;transform-origin:0 50%}
.chip{background:var(--o);color:#fff;font-family:JB,monospace;font-weight:700;font-size:20px;padding:5px 12px;border-radius:10px;white-space:nowrap;box-shadow:0 8px 20px rgba(238,98,26,.35)}
.stamp{border:5px solid var(--o2);color:var(--o2);font-family:JB,monospace;font-weight:800;letter-spacing:.14em;font-size:26px;padding:10px 18px;border-radius:12px;white-space:nowrap;background:rgba(255,253,248,.85)}
.panel{width:430px;background:#fff;border-radius:22px;padding:22px 24px;box-shadow:0 30px 70px rgba(40,20,5,.18),0 0 0 1px #ece4d6}
.tg{width:56px;height:32px;border-radius:16px;background:var(--o);position:relative}
.tg i{position:absolute;top:4px;left:28px;width:24px;height:24px;border-radius:50%;background:#fff;display:block}
.btn{margin-top:16px;height:58px;border-radius:14px;background:var(--ink);color:#fff;font-weight:650;font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}
.ripple{position:absolute;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.45)}
/* languages */
.reelbox{background:var(--o);border-radius:40px;overflow:hidden;position:absolute}
.reel{position:absolute;left:0;right:0;top:0}
.ri{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.vbars{display:flex;align-items:center;gap:7px}
.vbars i{display:block;width:8px;border-radius:4px;background:#d6cdbf}
/* dashboard */
.browser{width:1440px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 60px 140px rgba(40,20,5,.2),0 0 0 1px #e8e0d2}
.bbar{height:44px;background:#f1ece4;display:flex;align-items:center;gap:9px;padding:0 18px}
.bbar i{width:13px;height:13px;border-radius:50%;display:block}
.shot{position:relative;width:1440px;height:900px;background:url(ph/overview.png) 0 0/1440px 900px}
.ov{position:absolute;background:#fff}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
/* icons */
.ico path,.ico circle,.ico rect,.ico line,.ico polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body>
<div id="stage"></div>
<script>
const q=new URLSearchParams(location.search);
const W=+q.get('w')||1080,H=+q.get('h')||1920,P=H>W;

// ---------- math ----------
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));

const bez=(x1,y1,x2,y2)=>{const f=(t,a,b)=>3*a*t*(1-t)*(1-t)+3*b*t*t*(1-t)+t*t*t;return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1;for(let i=0;i<24;i++){const m=(lo+hi)/2;f(m,x1,x2)<x?lo=m:hi=m}return f((lo+hi)/2,y1,y2)}};
const E={oExpo:bez(.19,1,.22,1),oQuint:bez(.23,1,.32,1),ioQuart:bez(.77,0,.175,1),iCub:bez(.55,.055,.675,.19),back:bez(.175,.885,.32,1.275),soft:bez(.25,.1,.25,1)};

function T(el,x,y,s=1,r=0){el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(${s}) rotate(${r}deg)`}
function O(el,o){el.style.opacity=o}
function B(el,b){el.style.filter=b>.15?`blur(${b.toFixed(2)}px)`:'none'}
function mk(tag,cls,html,parent,style){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)e.style.cssText+=style;(parent||stage).appendChild(e);return e}
function words(parent,text,cls,style){ // returns [{w,i}] masked words; supports <serif>word</serif>
  const out=[];text.split(' ').forEach((wd,k)=>{const serif=wd.startsWith('~');const w=mk('span','mask',null,parent);const i=mk('span',serif?'serif':'',serif?wd.slice(1):wd,w);if(k)w.style.marginLeft='.24em';out.push({w,i})});return out}
function revealW(ws,t,start,stg=.07,dur=.55,out=null,outDur=.3){ws.forEach((o,k)=>{const a=start+k*stg;const e=ease(E.oExpo,t,a,a+dur);let y=(1-e)*110;if(out!=null){y-=ease(E.iCub,t,out+k*.03,out+k*.03+outDur)*110}o.i.style.transform=`translateY(${y}%)`})}
function scene(bg){const d=mk('div','scene');d.style.background=bg;return d}
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const LOGO=(bubble,rec,l1,l2)=>`<svg viewBox="0 0 64 64" width="100%" height="100%" style="overflow:visible"><path class="lb" d="M32 4C16.54 4 4 15.4 4 29.5c0 7.3 3.37 13.88 8.78 18.53L10.2 59.2a1 1 0 0 0 1.43 1.1l12.06-6.02A30.6 30.6 0 0 0 32 55c15.46 0 28-11.4 28-25.5S47.46 4 32 4Z" fill="${bubble}"/><g class="lr"><path d="M20 15a2.5 2.5 0 0 1 2.5-2.5h19A2.5 2.5 0 0 1 44 15v31l-3-2.2-3 2.2-3-2.2-3 2.2-3-2.2-3 2.2-3-2.2-3 2.2Z" fill="${rec}"/><rect x="25" y="20" width="14" height="2.6" rx="1.3" fill="${l1}"/><rect x="25" y="26" width="10" height="2.6" rx="1.3" fill="${l2}"/><rect x="25" y="32" width="12" height="2.6" rx="1.3" fill="${l2}"/></g></svg>`;
const WAICON=`<svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3.5c-4.7 0-8.5 3.3-8.5 7.5 0 2.1 1 4 2.6 5.4l-.7 3.3 3.4-1.7c1 .3 2.1.5 3.2.5 4.7 0 8.5-3.3 8.5-7.5S16.7 3.5 12 3.5Z" fill="#fff"/></svg>`;
const CURSOR=`<svg width="44" height="44" viewBox="0 0 24 24"><path d="M5 3l14 7.5-6.2 1.7L10 18.5z" fill="#141210" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>`;

// =====================================================================
// SCENE 1 — HOOK (0 – 3.62)
// =====================================================================
const s1=scene('#141210');
const s1t=mk('div','a h',null,s1,`color:#fff;font-size:${L(176,190)}px;white-space:nowrap`);
const s1w=words(s1t,'Lunch ~rush.');
const s1k=mk('div','a kick',null,s1,`color:var(--o);font-size:${L(26,26)}px;white-space:nowrap`);s1k.textContent='12:47 PM · Saturday';
const ph1=mk('div','a phone',null,s1);const sc1=mk('div','scr lock',null,ph1);mk('div','notch',null,sc1);
mk('div',null,'<div style="position:absolute;left:0;right:0;top:96px;text-align:center;font-size:17px;opacity:.75">Saturday 16 November</div><div style="position:absolute;left:0;right:0;top:118px;text-align:center;font-size:104px;font-weight:600;letter-spacing:-.03em">12:47</div>',sc1);
const NOTIFS=[['Maria','2 large pepperoni pls, pickup'],['Ahmed','are you open right now?'],['Lucía','🎤 Voice message (0:14)'],['Tom','do u deliver to green st'],['Priya','how much is the family meal?'],['Sam','hello??']];
const notifs=NOTIFS.map(([n,m])=>{const e=mk('div','notif',`<div class="ic">${WAICON}</div><div style="flex:1;min-width:0"><div class="t1"><span>WhatsApp</span><span>now</span></div><div class="t2">${n}</div><div class="t3">${m}</div></div>`,sc1);return e});
const NT=[1.95,2.28,2.58,2.84,3.08,3.3];
function r1(t){
  const tx=L(cx,150),ty=L(330,cy-90);
  if(P){T(s1t,cx,ty)}else{s1t.style.transform=`translate(${tx}px,${ty}px) translateY(-50%)`}
  revealW(s1w,t,.9,.32,.6);
  const kk=ease(E.oExpo,t,1.35,1.9);
  if(P){T(s1k,cx,ty+130+(1-kk)*20)}else{s1k.style.transform=`translate(${tx+6}px,${ty+120+(1-kk)*20}px)`}
  O(s1k,kk);
  const pe=ease(E.oExpo,t,1.45,2.25);
  let buzz=0;NT.forEach(a=>{if(t>=a)buzz+=Math.max(0,1-(t-a)/.22)});
  const jx=Math.sin(t*95)*buzz*5,jr=Math.sin(t*71)*buzz*.7;
  T(ph1,L(cx,1340)+jx,L(1290,cy+20)+(1-pe)*H*.6,L(1.06,.98),jr+(1-pe)*6);
  notifs.forEach((n,i)=>{const a=NT[i];const k=ease(E.oQuint,t,a,a+.35);
    let y=262;for(let j=i+1;j<NT.length;j++)y+=ease(E.oQuint,t,NT[j],NT[j]+.35)*102;
    n.style.top=(y-(1-k)*30)+'px';n.style.opacity=k;n.style.transform=`scale(${lerp(.92,1,k)})`;n.style.display=t>=a?'':'none'});
}

// =====================================================================
// SCENE 2 — PROBLEM (3.62 – 10.95)
// =====================================================================
const s2=scene('#141210');
const s2k=mk('div','a kick',null,s2,`color:var(--o);font-size:24px;white-space:nowrap`);
const s2kA=mk('span',null,'Every message is',s2k),s2kB=mk('span',null,'And while you\'re busy',s2k);s2kB.style.position='absolute';s2kB.style.left='0';
const S2WORDS=[['a ~customer.',4.76],['an ~order.',5.58],['a ~question.',6.39],['a voice ~note.',7.41],['they\'re ~waiting',10.2]];
const s2words=S2WORDS.map(([s,a])=>{const d=mk('div','a h',null,s2,`color:#fff;font-size:${L(150,150)}px;white-space:nowrap`);return {d,ws:words(d,s),a}});
const dots=mk('div','a',null,s2,'display:flex;gap:16px');const dotI=[0,1,2].map(()=>mk('i',null,null,dots,'display:block;width:26px;height:26px;border-radius:50%;background:#fff'));
const ph2=mk('div','a phone',null,s2);const sc2=mk('div','scr list',null,ph2);mk('div','notch',null,sc2);
const lh=mk('div','lhead','<span>Chats</span><span class="mono" style="font-size:17px;color:#8a8178;font-weight:500" id="clk">12:47</span>',sc2);
const ROWS=[['Maria','Hi! are you open now?','#d4508b',4.76],['Ahmed','2 large pepperoni pls 🍕','#2f8fd8',5.58],['Priya','how much is the family meal?','#d35400',6.39],['Lucía','🎤 0:14','#16a085',7.41]];
const OLD=[['Jake','thanks! see you','#8f5bd6'],['Chloé','Merci 🙏','#27ae60'],['Ken','ok','#6c5ce7']];
const rows2=[];
OLD.forEach((r,i)=>{const e=mk('div','row',`<div class="av" style="background:${r[2]}">${r[0][0]}</div><div class="mid"><div class="n">${r[0]}<span style="color:#9a938a">11:58</span></div><div class="p"><span>${r[1]}</span></div></div>`,sc2);e.style.opacity=.55;rows2.push({e,old:true,i})});
ROWS.forEach(r=>{const e=mk('div','row',`<div class="av" style="background:${r[2]}">${r[0][0]}</div><div class="mid"><div class="n">${r[0]}<span class="tt">12:47</span></div><div class="p"><span class="pv">${r[1]}</span><span class="b">1</span></div></div>`,sc2);rows2.push({e,a:r[3]})});
function r2(t){
  const tx=L(cx,140),wy=L(360,cy-60);
  // kicker
  const ka=ease(E.oExpo,t,3.74,4.2),kb=ease(E.oExpo,t,8.47,8.9);
  s2kA.style.opacity=ka*(1-kb);s2kB.style.opacity=kb;s2kA.style.transform=`translateY(${-kb*20}px)`;s2kB.style.transform=`translateY(${(1-kb)*20}px)`;
  if(P){T(s2k,cx,wy-130);s2k.style.textAlign='center'}else{s2k.style.transform=`translate(${tx+4}px,${wy-150}px)`}
  // swapping words
  s2words.forEach((o,i)=>{const nx=i<s2words.length-1?s2words[i+1].a:null;const outAt=i===3?8.5:nx;
    if(P)T(o.d,cx,wy);else o.d.style.transform=`translate(${tx}px,${wy}px) translateY(-50%)`;
    o.d.style.display=t>=o.a-.05&&(outAt==null||t<outAt+.5)?'':'none';
    revealW(o.ws,t,o.a,.06,.5,outAt==null?null:(i===3?outAt:outAt-.22),.22)});
  // "waiting" dots
  const dk=ease(E.oExpo,t,10.45,10.7);dots.style.opacity=dk;
  if(P)T(dots,cx,wy+110);else dots.style.transform=`translate(${tx+8}px,${wy+90}px)`;
  dotI.forEach((d,i)=>{d.style.transform=`translateY(${Math.sin(t*7-i*.9)*-8}px)`;d.style.opacity=.35+.65*Math.max(0,Math.sin(t*7-i*.9))});
  // phone
  const pe=ease(E.oExpo,t,3.62,4.3);
  T(ph2,L(cx,1340),L(1250,cy+20)+(1-pe)*120,L(1.06,.98),0);O(ph2,pe);
  // clock ages while you're busy
  const ck=ease(E.soft,t,8.5,10.3);const mins=Math.round(47+ck*32);const hh=mins>=60?'1':'12',mm=String(mins%60).padStart(2,'0');document.getElementById('clk').textContent=`${hh}:${mm}`;
  // rows: new ones insert at top
  let order=[];rows2.forEach(r=>{if(!r.old&&t>=r.a)order.unshift(r)});
  const olds=rows2.filter(r=>r.old);
  const RH=92,top0=120;
  rows2.forEach(r=>{
    if(r.old){let n=0;rows2.forEach(x=>{if(!x.old)n+=ease(E.oQuint,t,x.a,x.a+.4)});r.e.style.top=(top0+(n+r.i)*RH)+'px';return}
    const k=ease(E.oQuint,t,r.a,r.a+.4);let n=0;rows2.forEach(x=>{if(!x.old&&x.a>r.a)n+=ease(E.oQuint,t,x.a,x.a+.4)});
    r.e.style.top=(top0+n*RH-(1-k)*RH)+'px';r.e.style.opacity=k;r.e.style.display=t>=r.a?'':'none';
    r.e.style.background=`rgba(255,${244+11*k},${236+19*k},1)`;
  });
  // waiting: badges climb, previews change
  const m=rows2[3].e,a=rows2[4].e; // Maria, Ahmed
  if(t>=9.3){m.querySelector('.pv').textContent='hello??';m.querySelector('.b').textContent='2'}else{m.querySelector('.pv').textContent='Hi! are you open now?';m.querySelector('.b').textContent='1'}
  if(t>=10.0){a.querySelector('.pv').textContent='never mind, ordering elsewhere';a.querySelector('.b').textContent='2'}else{a.querySelector('.pv').textContent='2 large pepperoni pls 🍕';a.querySelector('.b').textContent='1'}
  rows2.forEach(r=>{if(!r.old){r.e.querySelector('.tt').textContent=`${hh}:${mm}`}});
}

// =====================================================================
// SCENE 3 — BREATH + REVEAL (10.95 – 12.95)
